<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt lại mật khẩu — VideoAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><span class="logo-mark"><i class="fa-solid fa-play"></i></span> VideoAdmin</div>
      <h2 class="auth-title">Đặt lại mật khẩu</h2>
      <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

      <div id="auth-alert" class="auth-alert hidden" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="password">Mật khẩu mới</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="confirm">Xác nhận mật khẩu</label>
          <input class="form-control" type="password" id="confirm" name="confirm" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Cập nhật mật khẩu</button>
      </form>

      <p class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { initResetPage } from "./js/auth.js";
    initResetPage();
  </script>
</body>
</html>
