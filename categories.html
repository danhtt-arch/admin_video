<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categories — VideoAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="page-loader" id="page-loader"><div class="spinner"></div></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-wrapper">
      <header class="header" id="header"></header>
      <main class="content">
        <div class="page-header">
          <div>
            <h2>Danh mục Video</h2>
            <p>Phân loại video theo chủ đề.</p>
          </div>
          <button class="btn btn-primary hidden" id="btn-add"><i class="fa-solid fa-plus"></i> Thêm danh mục</button>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên danh mục</th>
                  <th>Slug</th>
                  <th>Số video</th>
                  <th>Ngày tạo</th>
                  <th class="col-actions admin-col hidden">Actions</th>
                </tr>
              </thead>
              <tbody id="category-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="category-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 id="category-modal-title">Thêm danh mục</h3>
        <button class="btn-icon" data-close-modal aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="category-form" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="c-name">Tên danh mục *</label>
            <input class="form-control" id="c-name" maxlength="100" required />
          </div>
          <div class="form-group">
            <label for="c-slug">Slug</label>
            <input class="form-control" id="c-slug" maxlength="100" />
            <div class="form-hint">Tự động sinh từ tên nếu để trống.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-modal>Hủy</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal-sm">
      <div class="modal-body" style="text-align:center">
        <div class="confirm-icon"><i class="fa-solid fa-trash"></i></div>
        <h3 style="margin-bottom:8px">Xóa danh mục?</h3>
        <p style="color:var(--text-muted)" id="confirm-text"></p>
      </div>
      <div class="modal-footer" style="justify-content:center">
        <button class="btn btn-outline" data-close-modal>Hủy</button>
        <button class="btn btn-danger" id="btn-confirm-delete">Xóa</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/categories.js"></script>
</body>
</html>
