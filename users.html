<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — VideoAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="page-loader" id="page-loader"><div class="spinner"></div></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-wrapper">
      <header class="header" id="header"></header>
      <main class="content">
        <div class="page-header">
          <div>
            <h2>Quản lý Người dùng</h2>
            <p>Phân quyền, khóa hoặc xóa tài khoản (chỉ dành cho ADMIN).</p>
          </div>
        </div>

        <div class="card">
          <div class="toolbar">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="search-input" class="form-control" placeholder="Tìm theo username hoặc email..." />
            </div>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Trạng thái</th>
                  <th>Ngày tạo</th>
                  <th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody id="user-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal-sm">
      <div class="modal-body" style="text-align:center">
        <div class="confirm-icon"><i class="fa-solid fa-user-xmark"></i></div>
        <h3 style="margin-bottom:8px">Xóa người dùng?</h3>
        <p style="color:var(--text-muted)" id="confirm-text"></p>
      </div>
      <div class="modal-footer" style="justify-content:center">
        <button class="btn btn-outline" data-close-modal>Hủy</button>
        <button class="btn btn-danger" id="btn-confirm-delete">Xóa</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/users.js"></script>
</body>
</html>
