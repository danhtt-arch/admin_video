<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu — VideoAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><span class="logo-mark"><i class="fa-solid fa-play"></i></span> VideoAdmin</div>
      <h2 class="auth-title">Quên mật khẩu</h2>
      <p class="auth-subtitle">Nhập email để nhận liên kết đặt lại mật khẩu.</p>

      <div id="auth-alert" class="auth-alert hidden" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Gửi liên kết khôi phục</button>
      </form>

      <p class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { initForgotPage } from "./js/auth.js";
    initForgotPage();
  </script>
</body>
</html>
